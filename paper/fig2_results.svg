<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5cb85c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6cb2eb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8898f;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Per-Head Accuracy (1700 training steps, base tier)</text>

  <!-- Axes -->
  <line x1="120" y1="50" x2="120" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="350" x2="570" y2="350" stroke="#333" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="110" y="354" text-anchor="end" font-size="11" fill="#555">0%</text>
  <line x1="120" y1="350" x2="125" y2="350" stroke="#333" stroke-width="1"/>
  <text x="110" y="284" text-anchor="end" font-size="11" fill="#555">25%</text>
  <line x1="120" y1="280" x2="125" y2="280" stroke="#333" stroke-width="1"/>
  <line x1="125" y1="280" x2="570" y2="280" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="110" y="214" text-anchor="end" font-size="11" fill="#555">50%</text>
  <line x1="120" y1="210" x2="125" y2="210" stroke="#333" stroke-width="1"/>
  <line x1="125" y1="210" x2="570" y2="210" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="110" y="144" text-anchor="end" font-size="11" fill="#555">75%</text>
  <line x1="120" y1="140" x2="125" y2="140" stroke="#333" stroke-width="1"/>
  <line x1="125" y1="140" x2="570" y2="140" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="110" y="74" text-anchor="end" font-size="11" fill="#555">100%</text>
  <line x1="120" y1="70" x2="125" y2="70" stroke="#333" stroke-width="1"/>

  <!-- Bars (each bar width=50, gap=20) -->
  <!-- coarse: 100% -->
  <rect x="155" y="70" width="45" height="280" rx="3" fill="url(#bar1)"/>
  <text x="177" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">100%</text>
  <text x="177" y="370" text-anchor="middle" font-size="11" fill="#555">coarse</text>
  <text x="177" y="382" text-anchor="middle" font-size="9" fill="#888">(12)</text>

  <!-- modality: 100% -->
  <rect x="225" y="70" width="45" height="280" rx="3" fill="url(#bar1)"/>
  <text x="247" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">100%</text>
  <text x="247" y="370" text-anchor="middle" font-size="11" fill="#555">modality</text>
  <text x="247" y="382" text-anchor="middle" font-size="9" fill="#888">(8)</text>

  <!-- subtype: 93.8% -->
  <rect x="295" y="87" width="45" height="263" rx="3" fill="url(#bar2)"/>
  <text x="317" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#007bff">93.8%</text>
  <text x="317" y="370" text-anchor="middle" font-size="11" fill="#555">subtype</text>
  <text x="317" y="382" text-anchor="middle" font-size="9" fill="#888">(24)</text>

  <!-- code_lang: 41.7% -->
  <rect x="365" y="234" width="45" height="116" rx="3" fill="url(#bar3)"/>
  <text x="387" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">41.7%</text>
  <text x="387" y="370" text-anchor="middle" font-size="11" fill="#555">code_lang</text>
  <text x="387" y="382" text-anchor="middle" font-size="9" fill="#888">(62)</text>

  <!-- text_lang: 94.3% -->
  <rect x="435" y="86" width="45" height="264" rx="3" fill="url(#bar2)"/>
  <text x="457" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#007bff">94.3%</text>
  <text x="457" y="370" text-anchor="middle" font-size="11" fill="#555">text_lang</text>
  <text x="457" y="382" text-anchor="middle" font-size="9" fill="#888">(30)</text>

  <!-- file_mime: 100% -->
  <rect x="505" y="70" width="45" height="280" rx="3" fill="url(#bar1)"/>
  <text x="527" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">100%</text>
  <text x="527" y="370" text-anchor="middle" font-size="11" fill="#555">file_mime</text>
  <text x="527" y="382" text-anchor="middle" font-size="9" fill="#888">(90)</text>

  <!-- Legend -->
  <text x="155" y="400" text-anchor="start" font-size="9" fill="#888">Parentheses: number of classes. risk mAP: 100% (not shown).</text>
</svg>
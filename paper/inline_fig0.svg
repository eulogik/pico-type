<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Helvetica,Arial,sans-serif">
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">v0.1 (Synthetic) vs v0.2 (Real Data) on Real-World Benchmarks</text>
  <text x="350" y="46" text-anchor="middle" font-size="13" fill="#666">Code Language Detection (24 langs) · Text Language Detection (30 langs)</text>
  <text x="130" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Code Language Detection</text>
  <text x="130" y="95" text-anchor="middle" font-size="11" fill="#888">24 languages · The Heap dataset</text>
  <rect x="20" y="108" width="200" height="32" rx="4" fill="#dc3545"/>
  <text x="30" y="129" font-size="13" font-weight="bold" fill="#fff">v0.1 (synthetic)</text>
  <text x="230" y="129" font-size="13" font-weight="bold" fill="#dc3545">3.0%</text>
  <rect x="20" y="150" width="520" height="36" rx="6" fill="#28a745"/>
  <text x="30" y="174" font-size="14" font-weight="bold" fill="#fff">v0.2 (real data) — 60.3%</text>
  <text x="560" y="174" font-size="12" font-weight="bold" fill="#28a745">20× improvement</text>
  <text x="130" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Text Language Detection</text>
  <text x="130" y="230" text-anchor="middle" font-size="11" fill="#888">30 languages · Wikipedia</text>
  <rect x="20" y="243" width="140" height="32" rx="4" fill="#dc3545"/>
  <text x="30" y="264" font-size="13" font-weight="bold" fill="#fff">v0.1 (synthetic)</text>
  <text x="170" y="264" font-size="13" font-weight="bold" fill="#dc3545">19.0%</text>
  <rect x="20" y="285" width="550" height="36" rx="6" fill="#28a745"/>
  <text x="30" y="309" font-size="14" font-weight="bold" fill="#fff">v0.2 (real data) — 98.3%</text>
  <text x="580" y="309" font-size="12" font-weight="bold" fill="#28a745">5.2× improvement</text>
  <line x1="20" y1="340" x2="600" y2="340" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="355" font-size="11" fill="#999">0%</text>
  <text x="170" y="355" font-size="11" fill="#999">25%</text>
  <text x="320" y="355" font-size="11" fill="#999">50%</text>
  <text x="470" y="355" font-size="11" fill="#999">75%</text>
  <text x="610" y="355" font-size="11" fill="#999">100%</text>
  <rect x="20" y="365" width="12" height="12" rx="2" fill="#dc3545"/>
  <text x="36" y="376" font-size="11" fill="#666">Synthetic training</text>
  <rect x="160" y="365" width="12" height="12" rx="2" fill="#28a745"/>
  <text x="176" y="376" font-size="11" fill="#666">Real-data training</text>
</svg>
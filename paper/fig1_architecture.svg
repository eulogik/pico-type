<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d0eaf0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e8f8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0d0f0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f8e8e8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0d0d0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Input -->
  <rect x="200" y="10" width="300" height="50" rx="8" fill="url(#grad1)" stroke="#333" stroke-width="2"/>
  <text x="350" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Raw UTF-8 Bytes (1–1024)</text>

  <line x1="350" y1="60" x2="350" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ByteEmbed -->
  <rect x="200" y="90" width="300" height="55" rx="8" fill="url(#grad2)" stroke="#333" stroke-width="2"/>
  <text x="350" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Byte Embedding</text>
  <text x="350" y="136" text-anchor="middle" font-size="12" fill="#555">256 × 96d learned embedding</text>

  <line x1="350" y1="145" x2="350" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ConvBlock 1 -->
  <rect x="175" y="175" width="350" height="55" rx="8" fill="url(#grad1)" stroke="#333" stroke-width="2"/>
  <text x="350" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Conv1D Block 1 (k=3)</text>
  <text x="350" y="218" text-anchor="middle" font-size="12" fill="#555">Conv → LayerNorm → GELU → Residual (96→96d)</text>

  <line x1="350" y1="230" x2="350" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ConvBlock 2 -->
  <rect x="175" y="260" width="350" height="55" rx="8" fill="url(#grad1)" stroke="#333" stroke-width="2"/>
  <text x="350" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Conv1D Block 2 (k=5)</text>
  <text x="350" y="303" text-anchor="middle" font-size="12" fill="#555">Conv → LayerNorm → GELU → Residual (96→192d)</text>

  <line x1="350" y1="315" x2="350" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ConvBlock 3 -->
  <rect x="175" y="345" width="350" height="55" rx="8" fill="url(#grad1)" stroke="#333" stroke-width="2"/>
  <text x="350" y="370" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Conv1D Block 3 (k=7)</text>
  <text x="350" y="388" text-anchor="middle" font-size="12" fill="#555">Conv → LayerNorm → GELU → Residual (192→192d)</text>

  <line x1="350" y1="400" x2="350" y2="430" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Attention 1 -->
  <rect x="175" y="430" width="350" height="55" rx="8" fill="url(#grad2)" stroke="#333" stroke-width="2"/>
  <text x="350" y="455" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">BiAttention Block 1 (4 heads, RoPE)</text>
  <text x="350" y="473" text-anchor="middle" font-size="12" fill="#555">Pre-norm → QKV → RoPE → SDPA → MLP</text>

  <line x1="350" y1="485" x2="350" y2="515" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Attention 2 -->
  <rect x="175" y="515" width="350" height="55" rx="8" fill="url(#grad2)" stroke="#333" stroke-width="2"/>
  <text x="350" y="540" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">BiAttention Block 2 (4 heads, RoPE)</text>
  <text x="350" y="558" text-anchor="middle" font-size="12" fill="#555">Pre-norm → QKV → RoPE → SDPA → MLP</text>

  <line x1="350" y1="570" x2="350" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pool -->
  <rect x="200" y="600" width="300" height="55" rx="8" fill="url(#grad3)" stroke="#333" stroke-width="2"/>
  <text x="350" y="625" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Statistical Pooling</text>
  <text x="350" y="643" text-anchor="middle" font-size="12" fill="#555">[Mean ∥ Max ∥ Std] → 576d vector</text>

  <line x1="350" y1="655" x2="350" y2="685" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Heads bracket -->
  <rect x="200" y="685" width="300" height="30" rx="6" fill="#444" stroke="#333" stroke-width="1"/>
  <text x="350" y="705" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">7× Matryoshka Heads (sliced 16/64/192/576)</text>

  <line x1="350" y1="715" x2="350" y2="740" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output boxes -->
  <rect x="40" y="740" width="140" height="50" rx="6" fill="#d4edda" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="765" text-anchor="middle" font-size="13" font-weight="bold" fill="#155724">coarse</text>
  <text x="110" y="781" text-anchor="middle" font-size="10" fill="#155724">12 classes</text>

  <rect x="190" y="740" width="140" height="50" rx="6" fill="#d4edda" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="765" text-anchor="middle" font-size="13" font-weight="bold" fill="#155724">modality</text>
  <text x="260" y="781" text-anchor="middle" font-size="10" fill="#155724">8 classes</text>

  <rect x="340" y="740" width="140" height="50" rx="6" fill="#d4edda" stroke="#333" stroke-width="1.5"/>
  <text x="410" y="765" text-anchor="middle" font-size="13" font-weight="bold" fill="#155724">subtype</text>
  <text x="410" y="781" text-anchor="middle" font-size="10" fill="#155724">24 classes</text>

  <rect x="490" y="740" width="140" height="50" rx="6" fill="#d4edda" stroke="#333" stroke-width="1.5"/>
  <text x="560" y="765" text-anchor="middle" font-size="13" font-weight="bold" fill="#155724">code_lang</text>
  <text x="560" y="781" text-anchor="middle" font-size="10" fill="#155724">62 classes</text>

  <rect x="40" y="800" width="140" height="50" rx="6" fill="#cce5ff" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="825" text-anchor="middle" font-size="13" font-weight="bold" fill="#004085">text_lang</text>
  <text x="110" y="841" text-anchor="middle" font-size="10" fill="#004085">30 classes</text>

  <rect x="190" y="800" width="140" height="50" rx="6" fill="#cce5ff" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="825" text-anchor="middle" font-size="13" font-weight="bold" fill="#004085">file_mime</text>
  <text x="260" y="841" text-anchor="middle" font-size="10" fill="#004085">90 classes</text>

  <rect x="340" y="800" width="140" height="50" rx="6" fill="#f8d7da" stroke="#333" stroke-width="1.5"/>
  <text x="410" y="825" text-anchor="middle" font-size="13" font-weight="bold" fill="#721c24">risk</text>
  <text x="410" y="841" text-anchor="middle" font-size="10" fill="#721c24">6 sigmoid labels</text>
</svg>